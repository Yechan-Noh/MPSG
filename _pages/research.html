---
layout: default
title: "Research"
permalink: /research/
author_profile: false
---
<div class="mt-page research-page">
<section class="funding support-roster" aria-labelledby="support-title">
  <h2 class="funding-title" id="support-title">Funding &amp; Support</h2>
  <div class="support-group"><h3>Current</h3><ul class="support-logos" aria-label="Current funding and support">
      <li class="support-logo"><img src="{{ '/assets/img/funding/access-logo.svg' | relative_url }}" alt="ACCESS"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/UND-logo.png' | relative_url }}" alt="University of Notre Dame"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/NCSA.png' | relative_url }}" alt="NCSA"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/TACC.jpg' | relative_url }}" alt="Texas Advanced Computing Center"></li>
  </ul></div>
  <div class="support-group"><h3>Previous</h3><ul class="support-logos" aria-label="Previous funding and support">
      <li class="support-logo"><img src="{{ '/assets/img/funding/nsf-logo.png' | relative_url }}" alt="National Science Foundation"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/UIUC.png' | relative_url }}" alt="University of Illinois Urbana-Champaign"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/UC_Berkeley.webp' | relative_url }}" alt="University of California, Berkeley"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/Kwanjeong.png' | relative_url }}" alt="Kwanjeong Educational Foundation"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/nist-logo.png' | relative_url }}" alt="NIST"></li>
      <li class="support-logo"><img src="{{ '/assets/img/funding/CU_Coulder.png' | relative_url }}" alt="University of Colorado Boulder"></li>
  </ul></div>
</section>
<div class="research-topic-grid">
{% for theme in site.data.research_themes %}
<section class="research-panel research-topic-card" id="{{ theme.id }}" aria-labelledby="{{ theme.id }}-title">
  <div class="research-panel-heading"><h2 id="{{ theme.id }}-title">{{ theme.title }}</h2></div>
  <div class="research-topic-content">
  <div class="research-topic-copy"><p>{{ theme.background_html }}</p><p>{{ theme.intro }}</p></div>
  <figure><a href="{{ theme.image | relative_url }}" aria-label="View full-size figure: {{ theme.title }}"><img src="{{ theme.image | relative_url }}" alt="{{ theme.caption }}" loading="lazy"></a><figcaption>{{ theme.caption }}</figcaption></figure>
  </div>
</section>
{% endfor %}
</div>
</div>
