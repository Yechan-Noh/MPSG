---
layout: default
title: "Research"
permalink: /research/
author_profile: false
---
<div class="mt-page research-page">
<section class="funding">
    <h2 class="funding-title">Funding & Support</h2>

    <!-- Current Sponsors -->
    <div class="sponsor-bar sponsor-bar--current">
        <span class="sponsor-bar__title">Current:</span>
        <div class="sponsor-item size70">
            <img src="{{ '/assets/img/funding/access-logo.svg' | relative_url }}" alt="ACCESS">
        </div>
        <div class="sponsor-item size80">
            <img src="{{ '/assets/img/funding/UND-logo.png' | relative_url }}" alt="University of Notre Dame">
        </div>
        <div class="sponsor-item size90">
            <img src="{{ '/assets/img/funding/NCSA.png' | relative_url }}" alt="NCSA">
        </div>
        <div class="sponsor-item size70">
            <img src="{{ '/assets/img/funding/TACC.jpg' | relative_url }}" alt="Texas Advanced Computing Center">
        </div>
    </div>

    <!-- Previous Sponsors -->
    <div class="sponsor-bar sponsor-bar--previous">
        <span class="sponsor-bar__title">Previous:</span>
        <div class="sponsor-item size70">
            <img src="{{ '/assets/img/funding/nsf-logo.png' | relative_url }}" alt="National Science Foundation">
        </div>
        <div class="sponsor-item size80">
            <img src="{{ '/assets/img/funding/UIUC.png' | relative_url }}"
                alt="University of Illinois Urbana-Champaign">
        </div>
        <div class="sponsor-item size80">
            <img src="{{ '/assets/img/funding/UC_Berkeley.webp' | relative_url }}" alt="University of California, Berkeley">
        </div>
        <div class="sponsor-item size100">
            <img src="{{ '/assets/img/funding/Kwanjeong.png' | relative_url }}" alt="Kwanjeong Educational Foundation">
        </div>
        <div class="sponsor-item size100">
            <img src="{{ '/assets/img/funding/nist-logo.png' | relative_url }}" alt="NIST">
        </div>
        <div class="sponsor-item size100">
            <img src="{{ '/assets/img/funding/CU_Coulder.png' | relative_url }}" alt="University of Colorado Boulder">
        </div>
    </div>
</section>
{% for theme in site.data.research_themes %}
<section class="research-panel research-topic-card" id="{{ theme.id }}" aria-labelledby="{{ theme.id }}-title">
  <div class="research-panel-heading"><h2 id="{{ theme.id }}-title">{{ theme.title }}</h2></div>
  <div class="research-topic-content">
  <div class="research-topic-copy"><p>{{ theme.background_html }}</p><p>{{ theme.intro }}</p></div>
  <figure><a href="{{ theme.image | relative_url }}" aria-label="View full-size figure: {{ theme.title }}"><img src="{{ theme.image | relative_url }}" alt="{{ theme.caption }}" loading="lazy"></a><figcaption>{{ theme.caption }}</figcaption></figure>
  </div>
</section>
{% endfor %}
</div>
