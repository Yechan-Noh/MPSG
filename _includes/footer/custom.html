<!-- ===== MTSG Modern Footer (drop-in for custom.html) ===== -->
<style>
    /* Sticky layout: footer sits at bottom when content is short */
    html,
    body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
    }

    main,
    .page,
    .page__content {
        flex: 1 0 auto;
    }

    /* Light theme variables (now used everywhere) */
    :root {
        --ft-max: 780px;
        --ft-fg: var(--site-ink);
        --ft-muted: var(--site-muted);
        --ft-bg: var(--site-soft);
        --ft-card: var(--site-paper);
        --ft-border: var(--site-line);
        --ft-accent: var(--site-accent);
    }

    /* Outer footer strip */
    #mtsg-footer {
        flex-shrink: 0;
        width: 100%;
        background: var(--ft-bg);
        border-top: 1px solid var(--ft-border);
        padding: 24px 0 32px;
    }

    /* Centered card */
    .mtsg-footer__card {
        box-sizing: border-box;
        max-width: var(--ft-max);
        margin: 0 auto;
        background: var(--ft-card);
        border: 1px solid var(--ft-border);
        border-radius: 14px;
        padding: 14px 24px;
        color: var(--ft-fg);
        box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
    }

    /* Top micro-divider with gradient */
    .mtsg-footer__divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--ft-border), transparent);
        margin: 8px 0 8px;
        border: 0;
    }

    /* Row: left brand + right links */
    .mtsg-footer__row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 20px;
    }

    @media (max-width: 640px) {
        .mtsg-footer__row {
            grid-template-columns: 1fr;
            gap: 12px;
        }
    }

    /* Brand */
    .mtsg-footer__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        letter-spacing: .2px;
        white-space: nowrap;
    }

    .mtsg-footer__brand small {
        color: var(--ft-muted);
        font-weight: 500;
    }

    /* Link pills container */
    .mtsg-footer__links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5px;
        justify-content: flex-end;
    }

    @media (max-width: 640px) {
        .mtsg-footer__links {
            justify-content: flex-start;
            gap: 8px;
        }
    }

    /* Smaller pill buttons */
    .mtsg-pill {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 2px 6px;
        border: 1px solid var(--ft-border);
        border-radius: 999px;
        text-decoration: none;
        color: var(--ft-fg);
        font-size: 0.7rem;
        line-height: 1.1;
        transition: transform .15s ease, border-color .15s ease;
    }

    .mtsg-pill:hover {
        transform: translateY(-1px);
        border-color: var(--ft-accent);
    }

    .mtsg-pill svg {
        width: 12px;
        height: 12px;
    }

    /* Bottom fine print */
    .mtsg-footer__fine {
        margin: 8px 2px 0;
        color: var(--ft-muted);
        font-size: .8rem;
        text-align: center;
    }

    .mtsg-footer__fine a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .mtsg-footer__fine a:hover {
        text-decoration-color: var(--ft-accent);
    }

    /* Smaller "Top" button to match pills */
    .mtsg-top {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 0.7rem;
        color: var(--ft-muted);
        border: 1px solid var(--ft-border);
        border-radius: 999px;
        padding: 2px 6px;
        text-decoration: none;
        transition: transform .15s ease, border-color .15s ease;
    }

    .mtsg-top:hover {
        transform: translateY(-1px);
        border-color: var(--ft-accent);
    }

    .mtsg-top svg {
        width: 12px;
        height: 12px;
    }

    /* Remove outer footer background and padding */
    .page__footer,
    .mtsg-footer-wrap {
        background: transparent !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
    }

    #mtsg-footer {
        flex-shrink: 0;
        width: 100%;
        background: transparent !important;
        border-top: 0 !important;
        padding: 24px 0 32px;
    }

    /* if Minimal Mistakes wrapper exists, make it transparent too */
    .page__footer,
    .mtsg-footer-wrap,
    .site-footer {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
    }
</style>

</footer>
